<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ content.html_title }}</title>
  {{ standard_header_includes }}
  <link rel="stylesheet" href="{{ get_asset_url('../css/main.css') }}">
</head>
<body>

{% include "./partials/header.html" %}

<main>

  <!-- MEMBERSHIP -->
  <div class="membership-section">
    <div class="membership-image">
      <img src="{{ get_asset_url('../images/signup.jpg') }}" alt="Become a member">
    </div>
    <div class="membership-form-panel">
      <h1 class="reveal">Become a Member</h1>
      <!-- MEMBERSHIP FORM — replace GUID after running setup-hubspot-forms.js -->
      <script charset="utf-8" type="text/javascript" src="//js.hsforms.net/forms/embed/v2.js"></script>
      <script>
        hbspt.forms.create({
          region: "na1",
          portalId: "243871292",
          formId: "bb888823-ca3c-4446-b1b6-0391d00f8a7c",
          css: ""
        });
      </script>
    </div>
  </div>

  <!-- PARTNERSHIP -->
  <div class="partnership-section">
    <div class="partnership-bg">
      <img src="{{ get_asset_url('../images/partner_inquiry.jpg') }}" aria-hidden="true" alt="">
    </div>
    <div class="partnership-content">
      <h1 class="reveal">Partner with Us</h1>
      <p class="section-intro reveal">
        Join our network of partners committed to supporting diaspora and
        immigrant entrepreneurs.
      </p>
      <!-- PARTNERSHIP FORM — replace GUID after running setup-hubspot-forms.js -->
      <script>
        hbspt.forms.create({
          region: "na1",
          portalId: "243871292",
          formId: "2c33e0df-0db6-4be2-9eab-e52eac2af84d",
          css: ""
        });
      </script>
    </div>
  </div>

</main>

{% include "./partials/footer.html" %}

{{ standard_footer_includes }}
<script src="{{ get_asset_url('../js/main.js') }}"></script>
</body>
</html>
